# CI de Unity, opcional (AC-APP-19-05; 02-tech-design §1.1; QA-V2-14): EditMode y PlayMode con GameCI, sin y con el modo
# simulador, a pedido y solo si el repositorio tiene la licencia de Unity en los secretos (UNITY_LICENSE, UNITY_EMAIL,
# UNITY_PASSWORD). El CI de dotnet es ci-core.yml.
# Con simulator: true, el define se activa SOLO para la corrida de tests, en el checkout efímero del runner, como
# tools/unity/run-unity-tests.ps1 -Simulator en la PC: tools/unity/ci-simulator-define.sh enable lo agrega a
# ProjectSettings.asset y deja la marca de SimulatorDefine; Unity recibe -rowmateSimulatorTestRun (lo acepta
# SimulatorInUnityTests.CommittedSettingsDoNotEnableTheSimulator) y al final "restore" deja todo como en el commit antes de
# que se guarde la caché. Este workflow no compila players ni commitea nada (R-01).
name: ci-unity

on:
  workflow_dispatch:

jobs:
  unity-tests:
    name: Unity ${{ matrix.testMode }}${{ matrix.simulator && ' + simulador' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
        simulator: [false, true]
    steps:
      - name: Requiere la licencia de Unity en los secretos
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then echo "::error::Falta el secreto UNITY_LICENSE (ver tools/unity/README.md)"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-sim-${{ matrix.simulator }}-${{ hashFiles('Packages/packages-lock.json') }}
      - name: Modo simulador solo para esta corrida
        if: ${{ matrix.simulator }}
        run: bash tools/unity/ci-simulator-define.sh enable
      - name: Tests (${{ matrix.testMode }})
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.27f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts-${{ matrix.testMode }}-sim-${{ matrix.simulator }}
          customParameters: ${{ matrix.simulator && '-rowmateSimulatorTestRun' || '' }}
      - name: Restaurar los defines y sacar la marca (antes de guardar la caché)
        if: ${{ always() && matrix.simulator }}
        run: bash tools/unity/ci-simulator-define.sh restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-${{ matrix.testMode }}-sim-${{ matrix.simulator }}
          path: artifacts-${{ matrix.testMode }}-sim-${{ matrix.simulator }}
