# CI de Unity, opcional (AC-APP-19-05; 02-tech-design §1.1): EditMode y PlayMode con GameCI, a pedido y solo si el
# repositorio tiene la licencia de Unity en los secretos (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD). No activa el modo
# simulador (esas pruebas corren en la PC con tools/unity/run-unity-tests.ps1 -Simulator). El CI de dotnet es ci-core.yml.
name: ci-unity

on:
  workflow_dispatch:

jobs:
  unity-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - name: Requiere la licencia de Unity en los secretos
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then echo "::error::Falta el secreto UNITY_LICENSE (ver tools/unity/README.md)"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/packages-lock.json') }}
      - name: Tests (${{ matrix.testMode }})
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.27f1
          testMode: ${{ matrix.testMode }}
          artifactsPath: artifacts-${{ matrix.testMode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-${{ matrix.testMode }}
          path: artifacts-${{ matrix.testMode }}
